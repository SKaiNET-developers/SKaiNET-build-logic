GROUP=sk.ainet.buildlogic
VERSION_NAME=1.0.0
POM_DESCRIPTION=Shared Gradle convention plugins for SKaiNET-developers org repos

POM_URL=https://github.com/SKaiNET-developers/SKaiNET-build-logic/
POM_SCM_URL=https://github.com/SKaiNET-developers/SKaiNET-build-logic
POM_SCM_CONNECTION=scm:git:git@github.com:SKaiNET-developers/SKaiNET-build-logic.git
POM_SCM_DEV_CONNECTION=scm:git:ssh@github.com:SKaiNET-developers/SKaiNET-build-logic.git

POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://mit-license.org/
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=SKaiNET-developers
POM_DEVELOPER_NAME=SKaiNET development team
POM_DEVELOPER_URL=https://github.com/SKaiNET-developers/

# Maven Central (vanniktech maven publish plugin) -- same flags as the org's other repos.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
SONATYPE_HOST=DEFAULT
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=true

#Gradle
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
